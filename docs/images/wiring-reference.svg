<text x="62" y="872" text-anchor="start" fill="#526b7c" font-size="18" font-weight="500">Join logic and</text>
<text x="62" y="896" text-anchor="start" fill="#526b7c" font-size="18" font-weight="500">motor grounds.</text>
<rect x="658" y="723" width="502" height="220" rx="17" fill="#ffffff" stroke="#cad9e4" stroke-width="2"/>
<text x="681" y="760" text-anchor="start" fill="#172c3e" font-size="25" font-weight="700">HC-SR04 integration</text>
<text x="682" y="790" text-anchor="start" fill="#935016" font-size="15" font-weight="760">PLANNED</text>
<text x="682" y="824" text-anchor="start" fill="#354b5e" font-size="19" font-weight="500">Choose Trigger and Echo GPIOs together.</text>
<text x="682" y="852" text-anchor="start" fill="#354b5e" font-size="19" font-weight="500">For a standard 5 V module, step Echo down</text>
<text x="682" y="880" text-anchor="start" fill="#354b5e" font-size="19" font-weight="500">to 3.3 V before it reaches the ESP32-S3.</text>
