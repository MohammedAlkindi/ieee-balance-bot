<circle cx="716" cy="563" r="5" fill="#a64333" stroke="none" stroke-width="2"/>
<text x="65" y="626" text-anchor="start" fill="#354b5e" font-size="18" font-weight="500">One 100 µF low-ESR capacitor across VM and GND at each driver.</text>
<text x="65" y="673" text-anchor="start" fill="#172c3e" font-size="19" font-weight="650">Use one power source for the ESP32-S3. Leave the buck jumper open while USB powers it.</text>
