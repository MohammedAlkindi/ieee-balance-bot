<text x="682" y="344" text-anchor="start" fill="#354b5e" font-size="18" font-weight="500">Left address 0   MS1 → GND, MS2 → GND</text>
<text x="682" y="373" text-anchor="start" fill="#354b5e" font-size="18" font-weight="500">Right address 1   MS1 → VIO, MS2 → GND</text>
<text x="682" y="412" text-anchor="start" fill="#526b7c" font-size="16" font-weight="500">For STEP/DIR, leave both UART pins unused.</text>
<text x="682" y="434" text-anchor="start" fill="#526b7c" font-size="16" font-weight="500">Set the driver’s microstep pins for 1/16.</text>
