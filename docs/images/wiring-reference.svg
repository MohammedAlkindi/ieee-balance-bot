<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="976" viewBox="0 0 1200 976" role="img" aria-labelledby="title description">
<title id="title">Wiring reference</title>
<desc id="description">Control GPIOs, UART resistor placement, power protection, battery sense divider, and planned ultrasonic sensing.</desc>
