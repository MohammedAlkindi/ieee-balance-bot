<text x="317" y="348" text-anchor="start" fill="#354b5e" font-size="17" font-weight="500">Both driver EN pins (active low)</text>
<text x="65" y="380" text-anchor="start" fill="#172c3e" font-size="17" font-weight="620">3.3 V through 10 kΩ</text>
