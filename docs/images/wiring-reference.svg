<text x="431.5" y="569.65" text-anchor="middle" fill="#a64333" font-size="19" font-weight="670">5 A fuse</text>
<rect x="527" y="538" width="151" height="50" rx="9" fill="#faeee9" stroke="#cad9e4" stroke-width="2"/>
<text x="602.5" y="569.65" text-anchor="middle" fill="#a64333" font-size="19" font-weight="670">Main switch</text>
<rect x="756" y="538" width="344" height="50" rx="9" fill="#faeee9" stroke="#cad9e4" stroke-width="2"/>
<text x="928.0" y="569.65" text-anchor="middle" fill="#a64333" font-size="19" font-weight="670">Both driver VM inputs</text>
<path d="M198 563 H222" fill="none" stroke="#a64333" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M339 563 H365" fill="none" stroke="#a64333" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M496 563 H523" fill="none" stroke="#a64333" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M681 563 H752" fill="none" stroke="#a64333" stroke-width="3" marker-end="url(#arrow)"/>
