<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="508" viewBox="0 0 1200 508" role="img" aria-labelledby="title description">
<title id="title">What runs where</title>
<desc id="description">The robot connects its tilt sensor, ESP32-S3, and motors. The laptop builds and uploads firmware and may run the simulator or voice bridge.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1200" height="508" rx="24" fill="#f3f7fa" stroke="#cad9e4" stroke-width="2"/>
<text x="40" y="55" text-anchor="start" fill="#172c3e" font-size="38" font-weight="735">What runs where</text>
<text x="41" y="89" text-anchor="start" fill="#526b7c" font-size="21" font-weight="500">The balance loop runs on the ESP32-S3. A laptop is useful for setup and optional tools.</text>
<rect x="40" y="120" width="1120" height="203" rx="17" fill="#ffffff" stroke="#cad9e4" stroke-width="2"/>
<text x="63" y="157" text-anchor="start" fill="#172c3e" font-size="25" font-weight="700">On the robot</text>
<rect x="69" y="191" width="217" height="57" rx="9" fill="#e8f4f2" stroke="#cad9e4" stroke-width="2"/>
<text x="177.5" y="226.85" text-anchor="middle" fill="#08776b" font-size="21" font-weight="670">MPU-6050 tilt</text>
<rect x="413" y="177" width="371" height="79" rx="9" fill="#e5f0f8" stroke="#cad9e4" stroke-width="2"/>
<text x="598.5" y="224.9" text-anchor="middle" fill="#21658b" font-size="24" font-weight="670">ESP32-S3 balance loop</text>
<rect x="912" y="191" width="218" height="57" rx="9" fill="#e8f4f2" stroke="#cad9e4" stroke-width="2"/>
<text x="1021.0" y="226.5" text-anchor="middle" fill="#08776b" font-size="20" font-weight="670">Drivers + wheels</text>
<path d="M290 220 H407" fill="none" stroke="#21658b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M788 220 H906" fill="none" stroke="#21658b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="350" y="206" text-anchor="middle" fill="#21658b" font-size="16" font-weight="670">I²C</text>
<text x="847" y="206" text-anchor="middle" fill="#21658b" font-size="16" font-weight="670">STEP/DIR</text>
<path d="M178 282 H406" fill="none" stroke="#935016" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="69" y="289" text-anchor="start" fill="#935016" font-size="18" font-weight="700">HC-SR04</text>
<text x="423" y="289" text-anchor="start" fill="#935016" font-size="18" font-weight="620">Distance input planned</text>
<text x="1128" y="289" text-anchor="end" fill="#526b7c" font-size="18" font-weight="620">BLE gamepad optional</text>
<rect x="40" y="356" width="1120" height="112" rx="17" fill="#ffffff" stroke="#cad9e4" stroke-width="2"/>
<text x="63" y="393" text-anchor="start" fill="#172c3e" font-size="25" font-weight="700">On the laptop</text>
<text x="64" y="438" text-anchor="start" fill="#526b7c" font-size="20" font-weight="610">sim/  Physics model</text>
<text x="420" y="438" text-anchor="start" fill="#172c3e" font-size="20" font-weight="710">PlatformIO  Build and upload</text>
<text x="864" y="438" text-anchor="start" fill="#526b7c" font-size="20" font-weight="610">bridge/  Optional speech</text>
<path d="M597 329 V350" fill="none" stroke="#21658b" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="625" y="347" text-anchor="start" fill="#21658b" font-size="16" font-weight="650">USB</text>
</g></svg>
