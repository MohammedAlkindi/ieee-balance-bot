; ESP32-S3 balance firmware with gamepad drive (Bluepad32).
; Build: pio run   Flash: pio run -t upload   Monitor: pio device monitor
; Arduino-ESP32 3.3.12 runs as an ESP-IDF 5.5.5 component (pioarduino's hybrid mode), so
; sdkconfig.defaults and CMakeLists.txt here also shape the build. Bluepad32 and the BTstack
; files it needs are vendored under components/ and third_party/ (see THIRD_PARTY_NOTICES.md).
[platformio]
src_dir = main

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 921600
; PlatformIO picks the partition table here, not from sdkconfig: one 3 MB app
board_build.partitions = partitions_singleapp_large.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    janelia-arduino/TMC2209@10.1.1
; Arduino pulls in managed components this robot never uses; esp-sr alone is a 187 MB download.
custom_component_remove =
    espressif/esp-sr
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
    espressif/qrcode
    espressif/network_provisioning
    espressif/esp-modbus
    espressif/esp_matter
    chmorgan/esp-libhelix-mp3
