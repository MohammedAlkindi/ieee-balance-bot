; ESP32-S3 balance firmware. Build: pio run   Flash: pio run -t upload   Monitor: pio device monitor
; The official PlatformIO espressif32 platform ships Arduino-ESP32 2.x; pioarduino
; provides the 3.x core (ESP-IDF 5.5) with the timerBegin(frequency) timer API used here.
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    janelia-arduino/TMC2209@10.1.1
